name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - run: python -m pytest tests/ -q

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        id: backend
        with:
          path: bin
          key: bin-${{ hashFiles('backend/Dockerfile', 'backend/entrypoint.sh', 'backend/requirements.txt', 'backend/overlay.c', 'backend/listening.png', 'backend/stb_image.h') }}

      - name: Build backend
        if: steps.backend.outputs.cache-hit != 'true'
        run: |
          docker build --platform=linux/amd64 -t deckvoice-backend ./backend
          mkdir -p bin
          docker run --rm --platform=linux/amd64 \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -v "$GITHUB_WORKSPACE/bin:/backend/out" \
            deckvoice-backend

      - name: Stage backend out
        run: |
          test -x bin/whisper-server
          sudo rm -rf backend/out
          mkdir -p backend/out
          cp -a bin/. backend/out/

      - name: Stage python package
        run: cp -a deckvoice defaults/deckvoice

      - name: Download Decky CLI
        run: |
          curl -fL -o /tmp/decky-cli \
            https://github.com/SteamDeckHomebrew/cli/releases/download/0.0.7/decky-linux-x86_64
          chmod +x /tmp/decky-cli

      - name: Build plugin
        run: sudo /tmp/decky-cli plugin build -t /tmp/deckvoice-decky-build -o build-output -s directory .

      - name: Validate artifact
        run: |
          zip=$(find build-output -name '*.zip' | head -1)
          test -n "$zip"
          unzip -t "$zip"
          unzip -l "$zip" | grep -q 'bin/whisper-server'
          unzip -l "$zip" | grep -q 'bin/deckvoice-overlay'
          unzip -l "$zip" | grep -q 'bin/listening.png'
          unzip -l "$zip" | grep -q 'bin/ydotoold'
          unzip -l "$zip" | grep -q 'bin/lib/libggml'
          unzip -l "$zip" | grep -q 'cpython-311'
          unzip -l "$zip" | grep -q 'deckvoice/plugin.py'

      - uses: actions/upload-artifact@v4
        with:
          name: DeckVoice
          path: build-output/*.zip
